<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: linear-gradient(120deg, #f8fafc 0%, #e3f0ff 100%); }
        .container { max-width: 500px; margin-top: 60px; }
        .card { border: none; box-shadow: 0 4px 24px rgba(0,0,0,0.08); border-radius: 18px; }
        .btn-primary { border-radius: 30px; font-size: 1.1rem; padding: 0.6rem 2.2rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-body">
                <h2 class="mb-4" style="color:#0d6efd;">Register for AWS Community Day 2025</h2>
                <form method="post" action="/register/">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="first_name" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="first_name" name="first_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="last_name" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="last_name" name="last_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>
                {% if message %}
                <div class="alert alert-success mt-3">{{ message }}</div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
