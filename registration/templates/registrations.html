<!DOCTYPE html>
<html>
<head>
    <title>Registrations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: linear-gradient(120deg, #f8fafc 0%, #e3f0ff 100%); }
        .container { max-width: 700px; margin-top: 60px; }
        .card { border: none; box-shadow: 0 4px 24px rgba(0,0,0,0.08); border-radius: 18px; }
        .table { background: #fff; border-radius: 12px; }
        th { background: #e3f0ff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-body">
                <h2 class="mb-4" style="color:#0d6efd;">Registered Users</h2>
                {% if registrations %}
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Email</th>
                            <th>Registered At</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for reg in registrations %}
                        <tr>
                            <td>{{ reg.first_name }}</td>
                            <td>{{ reg.last_name }}</td>
                            <td>{{ reg.email }}</td>
                            <td>{{ reg.registered_at|date:'Y-m-d H:i' }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
                {% else %}
                <p>No registrations yet.</p>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
