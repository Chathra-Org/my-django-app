name: Run Pytest for Django

on:
  push:
    branches:
        - main
        - "feature/**"
        - "unit-tests/**"
  pull_request:
    branches: 
        - main
        - "feature/**"
        - "unit-tests/**"
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run pytest
        run: |
          mkdir -p test-results
          pytest --disable-warnings | tee test-results/pytest-results.txt
          exit ${PIPESTATUS[0]}
      #if failed save command output to a variable

      - name: 📊 Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results/

      - name: 💾 Save custom prompt variable
        if: failure()
        env:
          AWS_BEDROCK_AGENT_ID: ${{ secrets.AWS_BEDROCK_AGENT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          branch_name=$(echo "${{ github.ref }}" | sed 's|refs/heads/||')
          repo_url="https://github.com/${{ github.repository }}/tree/$branch_name"
          echo $repo_url
          intro_text="Given feature branch url is: $repo_url"
          prompt_string=$(cat .github/prompt.txt)
          pytest_output=$(cat test-results/pytest-results.txt)
          intro_text="Given feature branch url is: $repo_url"
          prompt="$input_text $prompt_string $pytest_output"
          echo "$prompt"
          response=$(aws bedrock-agent-runtime invoke-agent \
            --agent-id "$AWS_BEDROCK_AGENT_ID" \
            --input-text "$prompt" \
            --region us-east-1)
          echo "$response"